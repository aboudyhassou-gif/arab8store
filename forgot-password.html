<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>نسيت كلمة المرور | ARAB STORE</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/site-icon">
<link rel="apple-touch-icon" href="/site-icon">
<meta name="theme-color" content="#e63946">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=28">
<style>body{ padding-bottom:0; }</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-top">
    <div class="auth-logo"><div class="token-badge" style="--size:46px;"><i class="fa-solid fa-key"></i></div></div>
    <div class="auth-title">إعادة تعيين كلمة المرور</div>
    <div class="auth-sub">أدخل بريدك الإلكتروني وسنرسل لك كود التحقق</div>
  </div>

  <div class="auth-card">
    <!-- الخطوة 1: إدخال البريد -->
    <div id="step1">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <div class="input-wrap">
          <input type="email" id="fpEmail" placeholder="example@email.com" required>
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div class="field-error" id="fpError1"></div>
      </div>
      <button class="btn btn-primary mt-10" id="fpBtn1" onclick="sendCode()">
        <i class="fa-solid fa-paper-plane"></i> إرسال كود التحقق
      </button>
    </div>

    <!-- الخطوة 2: إدخال الكود + كلمة مرور جديدة -->
    <div id="step2" style="display:none;">
      <div class="info-banner" style="margin-bottom:12px;">
        <i class="fa-solid fa-envelope-open-text"></i>
        <div>أُرسل كود التحقق لبريدك — اكتبه هون مع كلمة مرور جديدة</div>
      </div>

      <div class="field">
        <label>كود التحقق (6 أرقام)</label>
        <div class="input-wrap">
          <input type="text" id="fpCode" placeholder="123456" maxlength="6">
          <i class="fa-solid fa-hashtag"></i>
        </div>
      </div>

      <div class="field mt-10">
        <label>كلمة المرور الجديدة</label>
        <div class="input-wrap">
          <input type="password" id="fpNewPw" placeholder="6 أحرف على الأقل" minlength="6">
          <i class="fa-solid fa-lock"></i>
          <button type="button" class="toggle-eye" onclick="togglePw('fpNewPw',this)"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="field-error" id="fpError2"></div>
      </div>

      <button class="btn btn-primary mt-10" id="fpBtn2" onclick="resetPassword()">
        <i class="fa-solid fa-check"></i> تعيين كلمة مرور جديدة
      </button>
      <button class="btn btn-outline mt-10" onclick="showStep1()">رجوع</button>
    </div>

    <div class="auth-switch">تذكرت كلمة مرورك؟ <a href="/login.html">سجّل دخولك</a></div>
  </div>
</div>

<script src="js/app.js?v=13"></script>
<script>
  function togglePw(id,btn){ const i=document.getElementById(id),ic=btn.querySelector("i"); i.type=i.type==="password"?"text":"password"; ic.className=i.type==="text"?"fa-solid fa-eye-slash":"fa-solid fa-eye"; }
  function showStep1(){ document.getElementById("step1").style.display="block"; document.getElementById("step2").style.display="none"; }

  let _resetToken = "";

  async function sendCode(){
    const email = document.getElementById("fpEmail").value.trim();
    const errEl = document.getElementById("fpError1");
    errEl.style.display="none";
    if(!email){ errEl.textContent="أدخل بريدك الإلكتروني"; errEl.style.display="block"; return; }
    const btn = document.getElementById("fpBtn1");
    btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';
    try{
      await apiFetch("/auth/forgot-password", { method:"POST", body: JSON.stringify({ email }) });
      toast("تم إرسال كود التحقق لبريدك");
      document.getElementById("step1").style.display="none";
      document.getElementById("step2").style.display="block";
    }catch(err){
      errEl.textContent = err.message || "البريد غير مسجّل";
      errEl.style.display="block";
    }
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> إرسال كود التحقق';
  }

  async function resetPassword(){
    const code = document.getElementById("fpCode").value.trim();
    const pw = document.getElementById("fpNewPw").value;
    const errEl = document.getElementById("fpError2");
    errEl.style.display="none";
    if(!code || pw.length < 6){ errEl.textContent="تأكد من الكود وكلمة المرور"; errEl.style.display="block"; return; }
    const btn = document.getElementById("fpBtn2");
    btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري التعيين...';
    try{
      await apiFetch("/auth/reset-password", { method:"POST", body: JSON.stringify({ code, new_password: pw }) });
      toast("✅ تم تعيين كلمة مرور جديدة! سجّل دخولك الآن");
      setTimeout(()=> location.href="/login.html", 1000);
    }catch(err){
      errEl.textContent = err.message || "الكود غير صحيح أو منتهي الصلاحية";
      errEl.style.display="block";
    }
    btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-check"></i> تعيين كلمة مرور جديدة';
  }
</script>
</body>
</html>
