<script src="js/app.js?v=13"></script>
<script>
  const ICON_POOL = ["fa-gamepad","fa-coins","fa-credit-card","fa-hashtag","fa-mobile-screen","fa-tv","fa-gift","fa-puzzle-piece","fa-bolt"];
  const ART_POOL = ["art-red","art-gold","art-purple","art-green","art-blue","art-pink"];
  function visualFor(i){ return { icon: ICON_POOL[i % ICON_POOL.length], art: ART_POOL[i % ART_POOL.length] }; }

  function getParam(name){ return new URLSearchParams(location.search).get(name); }

  function setTitle(txt){
    document.getElementById("sectionTitleText").textContent = txt;
  }
  function showLoading(){
    document.getElementById("sectionLoadingChip").style.display = "inline-flex";
    document.getElementById("productsLoader").style.display = "flex";
    document.getElementById("productsGrid").style.display = "none";
  }
  function hideLoading(){
    document.getElementById("sectionLoadingChip").style.display = "none";
    document.getElementById("productsLoader").style.display = "none";
    document.getElementById("productsGrid").style.display = "grid";
  }

  function setupBackButton(){
    const subsectionId = getParam("subsection_id");
    const section = getParam("section") || "";
    const sectionId = getParam("section_id");
    if(subsectionId && section && sectionId){
      document.getElementById("backBtn").href = `/products.html?section=${encodeURIComponent(section)}&section_id=${encodeURIComponent(sectionId)}`;
    }else{
      document.getElementById("backBtn").href = "/store.html";
    }
  }

  async function loadProducts(){
    setupBackButton();
    const section = getParam("section") || "";
    const subsectionId = getParam("subsection_id");
    const sectionId = getParam("section_id");
    const box = document.getElementById("productsGrid");

    showLoading();

    // ===== حالة 1: دخلنا مباشرة على قسم فرعي محدد -> اعرض منتجاته =====
    if(subsectionId){
      setTitle(getParam("subsection_name") || section || "المنتجات");
      try{
        const products = await apiFetch("/store/products?subsection_id=" + encodeURIComponent(subsectionId));
        hideLoading();
        renderProductTiles(products, box, "لا توجد منتجات بهذا القسم الفرعي بعد");
      }catch(err){
        hideLoading();
        box.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-plug-circle-xmark"></i><div class="t">تعذّر تحميل المنتجات</div></div>`;
      }
      return;
    }

    setTitle(section || "المنتجات");

    // ===== حالة 2: دخلنا على قسم رئيسي -> اعرض الفروع والمنتجات معاً =====
    if(sectionId){
      let subs = [];
      let products = [];
      try{
        subs = await apiFetch("/store/subsections?section_id=" + encodeURIComponent(sectionId)) || [];
      }catch(err){ subs = []; }
      try{
        // المنتجات المباشرة على القسم (بدون فرع)
        products = await apiFetch("/store/products?section=" + encodeURIComponent(section)) || [];
      }catch(err){ products = []; }
      hideLoading();
      if(!subs.length && !products.length){
        box.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-box-open"></i><div class="t">ما في منتجات بهالقسم بعد</div></div>`;
        return;
      }
      let html = "";
      if(subs.length){
        html += subs.map((s,i)=>{
          const v = visualFor(i);
          const art = s.image ? `<img src="${s.image}" alt="${s.name}" loading="lazy" decoding="async">` : `<i class="fa-solid ${v.icon}"></i>`;
          return `
          <a class="photo-tile" href="/products.html?section=${encodeURIComponent(section)}&section_id=${encodeURIComponent(sectionId)}&subsection_id=${s.id}&subsection_name=${encodeURIComponent(s.name)}">
            <div class="photo-tile-art ${s.image ? '' : v.art}">                ${art}${tileBadges(s)}
            </div>
            <div class="photo-tile-banner" dir="auto">${s.emoji||''} ${s.name}</div>
          </a>`;
        }).join("");
      }
      if(products.length){
        const offset = subs.length;
        html += products.map((p,i)=>{
          const v = visualFor(offset + i);
          const art = p.image
            ? `<img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async">`
            : `<i class="fa-solid ${v.icon}"></i>`;
          return `
          <a class="photo-tile" href="/product.html?id=${p.id}&name=${encodeURIComponent(p.name)}">
            <div class="photo-tile-art ${p.image ? '' : v.art}${tileCls(p)}">          ${art}${tileBadges(p)}
            </div>
            <div class="photo-tile-banner" dir="auto">${p.emoji||''} ${p.name}</div>
          </a>`;
        }).join("");
      }
      box.innerHTML = html;
      return;
    }

    // ===== حالة 3: لا توجد أقسام فرعية -> اعرض منتجات القسم مباشرة =====
    try{
      const products = await apiFetch("/store/products?section=" + encodeURIComponent(section));
      hideLoading();
      renderProductTiles(products, box, "ما في منتجات بهالقسم بعد");
    }catch(err){
      hideLoading();
      box.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-plug-circle-xmark"></i><div class="t">تعذّر تحميل المنتجات</div></div>`;
    }
  }

  function renderProductTiles(products, box, emptyMsg){
    if(!products.length){
      box.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-box-open"></i><div class="t">${emptyMsg}</div></div>`;
      return;
    }
    box.innerHTML = products.map((p,i)=>{
      const v = visualFor(i);
      const art = p.image
        ? `<img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async">`
        : `<i class="fa-solid ${v.icon}"></i>`;
      return `
      <a class="photo-tile" href="/product.html?id=${p.id}&name=${encodeURIComponent(p.name)}">
        <div class="photo-tile-art ${p.image ? '' : v.art}">          ${art}
        </div>
        <div class="photo-tile-banner" dir="auto">${p.emoji||''} ${p.name}</div>
      </a>`;
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", loadProducts);
</script>
</body>
